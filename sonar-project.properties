sonar.coverage.exclusions=app/src/test/**,**/*Test.kt,**/ui/**,**/*.gradle.kts
sonar.cpd.exclusions=**/*Test.kt,app/src/test/**
sonar.iac.activate=false
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/kover/report.xml,app/build/reports/kover/reportDebug.xml
