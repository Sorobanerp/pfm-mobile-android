name: CI Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, "release/**", main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-sast:
    name: Gitleaks + Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (secrets/PII)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Semgrep SAST
        run: |
          pip install semgrep
          semgrep scan --config auto --exclude .github --error .

  test-and-sonar:
    name: Testes (cobertura >= 95%) + SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Testes unitários e Kover XML
        run: |
          gradle --no-daemon testDebugUnitTest koverXmlReport
          cp -f app/build/reports/kover/report.xml app/build/reports/kover/reportDebug.xml || true
      - name: Exigir cobertura >= 95%
        run: python3 .github/scripts/check_coverage.py --format xml --file app/build/reports/kover/reportDebug.xml --min 95
      - name: SonarCloud (Quality Gate)
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  container-scan:
    name: Trivy (filesystem - app mobile sem imagem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs (CRITICAL,HIGH)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace aquasec/trivy:latest fs --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH .
